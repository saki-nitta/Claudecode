<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラフルゆうえんち せっけいず</title>
<style>
  @page { size: A4; margin: 10mm 12mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "HGMaruGothicMPRO", "UD Digi Kyokasho N-R", "Yu Gothic", "Meiryo", sans-serif;
    color: #333;
    margin: 0;
  }

  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #ff8a5c;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 26px;
    margin: 0;
    color: #e8590c;
    letter-spacing: 0.05em;
  }
  .header .name-field {
    font-size: 14px;
    white-space: nowrap;
  }
  .header .name-field .blank {
    display: inline-block;
    min-width: 130px;
    border-bottom: 2px solid #333;
    height: 1.3em;
    margin-left: 6px;
  }

  section {
    border: 2px solid #ddd;
    border-radius: 14px;
    padding: 10px 14px 12px;
    margin-bottom: 8px;
  }
  .sec-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .sec-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    flex-shrink: 0;
  }
  .sec-title h2 {
    font-size: 17px;
    margin: 0;
    color: #333;
  }

  /* ① いろをきめよう */
  #sec1 .sec-num { background: #ff8a5c; }
  .color-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding: 4px 10px 2px;
  }
  .color-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .color-circle {
    width: 26mm;
    height: 26mm;
    border-radius: 50%;
    border: 3px dashed #bbb;
    background: #fff;
  }
  .color-item .color-label {
    font-size: 13px;
    color: #555;
  }

  /* ② アトラクションをきめよう */
  #sec2 .sec-num { background: #4dabf7; }
  .attraction-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    padding: 2px 6px 6px;
  }
  .attraction-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    width: 42%;
  }
  .checkbox {
    width: 18px;
    height: 18px;
    border: 2.5px solid #4dabf7;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .attraction-free {
    margin-top: 4px;
    padding: 0 6px;
  }
  .attraction-free .free-label {
    font-size: 13px;
    color: #777;
    margin-bottom: 3px;
  }
  .free-line {
    border-bottom: 1.5px dotted #bbb;
    height: 20px;
  }

  /* ③ ばしょをきめよう */
  #sec3 { flex: 1; display: flex; flex-direction: column; }
  #sec3 .sec-num { background: #63e6be; }
  .box-caption {
    font-size: 12.5px;
    color: #777;
    margin: -2px 0 8px 34px;
  }
  .box-wrap {
    position: relative;
    flex: 1;
    margin: 0 auto;
    width: 100%;
    max-width: 170mm;
    min-height: 130mm;
  }
  .box-frame {
    position: absolute;
    inset: 14px;
    border: 4px solid #333;
    border-radius: 6px;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 24px, #f2f2f2 24px, #f2f2f2 25px),
      repeating-linear-gradient(90deg, transparent, transparent 24px, #f2f2f2 24px, #f2f2f2 25px);
  }
  .box-side-label {
    position: absolute;
    font-size: 12px;
    color: #999;
    background: #fff;
    padding: 0 4px;
  }
  .side-top { top: -2px; left: 50%; transform: translate(-50%, -50%); }
  .side-bottom { bottom: -2px; left: 50%; transform: translate(-50%, 50%); }
  .side-left { left: -2px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
  .side-right { right: -2px; top: 50%; transform: translate(50%, -50%) rotate(90deg); }
</style>
</head>
<body>

<div class="header">
  <h1>カラフルゆうえんち せっけいず</h1>
  <div class="name-field">なまえ<span class="blank"></span></div>
</div>

<section id="sec1">
  <div class="sec-title">
    <span class="sec-num">1</span>
    <h2>いろをきめよう</h2>
  </div>
  <div class="color-row">
    <div class="color-item">
      <div class="color-circle"></div>
      <span class="color-label">いろ ①</span>
    </div>
    <div class="color-item">
      <div class="color-circle"></div>
      <span class="color-label">いろ ②</span>
    </div>
    <div class="color-item">
      <div class="color-circle"></div>
      <span class="color-label">いろ ③</span>
    </div>
  </div>
</section>

<section id="sec2">
  <div class="sec-title">
    <span class="sec-num">2</span>
    <h2>アトラクションをきめよう</h2>
  </div>
  <div class="attraction-grid">
    <div class="attraction-item"><span class="checkbox"></span>ジェットコースター</div>
    <div class="attraction-item"><span class="checkbox"></span>かんらんしゃ</div>
    <div class="attraction-item"><span class="checkbox"></span>メリーゴーランド</div>
    <div class="attraction-item"><span class="checkbox"></span>おばけやしき</div>
    <div class="attraction-item"><span class="checkbox"></span>コーヒーカップ</div>
  </div>
  <div class="attraction-free">
    <div class="free-label">じぶんでかんがえたアトラクション</div>
    <div class="free-line"></div>
    <div class="free-line"></div>
  </div>
</section>

<section id="sec3">
  <div class="sec-title">
    <span class="sec-num">3</span>
    <h2>ばしょをきめよう</h2>
  </div>
  <div class="box-caption">はこ の なか に なに を つくる？ すきな ばしょ に かいてみよう</div>
  <div class="box-wrap">
    <div class="box-frame">
      <span class="box-side-label side-top">おく</span>
      <span class="box-side-label side-bottom">てまえ</span>
      <span class="box-side-label side-left">ひだり</span>
      <span class="box-side-label side-right">みぎ</span>
    </div>
  </div>
</section>

</body>
</html>
